<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — VacAsia</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Firebase Configuration & Initialization -->
  <script src="../../js/firebaseConfig.js"></script>
  <!-- Main Application Script -->
  <script src="../../js/app.js"></script>
  <main class="page-container">
    <header class="topbar">
      <a class="brand" href="VAmain.html">VacAsia</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="VAmain.html">Home</a>
        <a href="search.html">Search</a>
        <a href="favorites.html">Favorites</a>
        <a href="booking.html">Booking</a>
        <a href="history.html">History</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <section class="post-header">
      <div class="post-header-inner">
        <p class="post-category">Contact</p>
        <h1>Contact the VacAsia team</h1>
        <p class="post-date">Get in touch for questions or feedback</p>
      </div>
    </section>

    <section class="content-layout">
      <article class="post-content">
        <section class="content-block">
          <h2>Get in touch</h2>
          <form class="form-card">
            <label>
              Name
              <input type="text" placeholder="Your name" />
            </label>
            <label>
              Email
              <input type="email" placeholder="you@example.com" />
            </label>
            <label>
              Message
              <textarea placeholder="Tell us what you need"></textarea>
            </label>
            <button class="button" type="submit">Send message</button>
          </form>
        </section>
      </article>

      <aside class="sidebar">
        <div class="info-card">
          <h4>Contact info</h4>
          <p>Email: hello@vacasia.com</p>
          <p>Support: support@vacasia.com</p>
          <p>Phone: +123 456 7890</p>
        </div>
      </aside>
    </section>

    <footer class="site-footer">
      <p>VacAsia | Discover vacation inspiration across Asia.</p>
    </footer>
  </main>
</body>
</html>
